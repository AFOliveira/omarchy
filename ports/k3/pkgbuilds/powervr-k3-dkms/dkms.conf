PACKAGE_NAME="powervr-k3"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="powervr"
DEST_MODULE_LOCATION[0]="/kernel/drivers/gpu/drm/imagination"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
# The sources are Linux 7.2.6's; DRM internals change between releases.
BUILD_EXCLUSIVE_KERNEL="^7\.2\."
AUTOINSTALL="yes"
