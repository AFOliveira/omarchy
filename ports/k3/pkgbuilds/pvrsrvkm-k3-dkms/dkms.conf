PACKAGE_NAME="pvrsrvkm-k3"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="pvrsrvkm"
DEST_MODULE_LOCATION[0]="/kernel/drivers/gpu/drm/img-rogue"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules -j$(nproc)"
# Mainline kernels only: SpacemiT's own kernel ships this driver.
# Not linux-k3 (release ending in -k3), which has this driver in its tree.
BUILD_EXCLUSIVE_KERNEL="^7\.[0-9.]+-arch[0-9]+-[0-9]+$"
AUTOINSTALL="yes"
