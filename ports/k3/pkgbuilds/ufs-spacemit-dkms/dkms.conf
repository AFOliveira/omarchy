PACKAGE_NAME="ufs-spacemit"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="ufs-spacemit"
DEST_MODULE_LOCATION[0]="/kernel/drivers/ufs/host"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
# Mainline kernels only: SpacemiT's own kernel has this driver built in, and the
# port to the 7.x UFS callbacks does not compile against 6.18.
# Not linux-k3 (release ending in -k3), which has this driver in its tree.
BUILD_EXCLUSIVE_KERNEL="^7\.[0-9.]+-arch[0-9]+-[0-9]+$"
AUTOINSTALL="yes"
